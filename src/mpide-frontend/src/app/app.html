<div class="flex flex-col h-screen overflow-hidden">
  <!-- Top Navbar -->
  <div class="flex items-center justify-between px-4 bg-[#0F172A] border-b border-[#1E293B] h-[5vh] min-h-[40px]">
    <div class="flex items-center gap-3">
      <button class="text-xs px-3 py-1 bg-[#1890FF] text-white rounded hover:bg-[#475569]">New Project</button>
      <span class="text-sm text-gray-400">Untitled Project</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-xs text-gray-500">Copyright</span>
      <span class="text-xs text-gray-500">Help</span>
      <span class="text-xs text-gray-500">Contact</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-1 overflow-hidden">
    <app-file-management class="min-w-[15%]"></app-file-management>
    <app-editor-panel class="flex-1 flex flex-col min-w-0 h-full" />
    <app-console class="max-w-[30%] w-full" [msgs]="[]"></app-console>
  </div>
</div>
