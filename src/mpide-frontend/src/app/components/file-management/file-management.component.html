<div class="flex flex-col gap-0 h-full">
  <div class="w-full bg-[#1E293B] text-white font-bold h-[4vh] p-3 flex justify-between items-center">
    <p>Files</p>
    <div (click)="handleClick()" class="flex flex-stretch p-2 cursor-pointer hover:bg-[#475569]">
      <nz-icon nzType="plus" nzTheme="outline"/>
    </div>
  </div>
  <nz-divider/>
  <div class="w-full bg-[#334155] text-white flex-1">
    <div class="flex flex-col gap-0 justify-start">
      @for (file of fileList(); track file.fileLink) {
        <app-file-card [file]="file"/>
      }
    </div>
  </div>
</div>
