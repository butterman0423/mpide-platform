<div class="flex flex-col h-screen overflow-hidden">
  <app-notification />
  <!-- Top Navbar -->   
  <div class="flex items-center justify-between px-4 bg-[#0F172A] border-b border-[#1E293B] h-[5vh] min-h-[40px]">
    <div class="flex items-center gap-3">
      <app-project-menu (projectCreated)="handleProjectCreated($event)" (projectSelected)="handleSelectedProject($event)"/>
      @if(fileStoreService.projectNameIsBeingEdited()){
        <div class="flex items-center gap-1.5 w-full">
          <input
            type="text"
            class="flex-1 min-w-0 px-2 py-1 text-sm text-white bg-white/10 border border-gray-500 focus:border-blue-400 focus:outline-none focus:ring-1 focus:ring-blue-400 rounded transition-all duration-150"
            [(ngModel)]="renamedProject"
            (keyup.enter)="acceptRename()"
          />

          <button
            type="submit"
            class="shrink-0 flex items-center justify-center w-7 h-7 rounded bg-blue-500 hover:bg-blue-400 active:bg-blue-600 text-white transition-colors duration-150"
            title="Confirm"
            (click) = "acceptRename()"
            
          >
            <nz-icon nzType="check" nzTheme="outline" />
          </button>

          <button
            type="button"
            class="shrink-0 flex items-center justify-center w-7 h-7 rounded bg-red-900 hover:bg-red-700 active:bg-red-800 text-white transition-colors duration-150"
            title="Cancel"
            (click) = "cancelRename()"
          >
            <nz-icon nzType="close" nzTheme="outline" />
          </button>
        </div>
}
      @else {

        <button 
          class="text-sm text-gray-400 hover:bg-[#54667a] cursor-pointer" 

          (click)="fileStoreService.projectNameIsBeingEdited.set(true)">
          {{fileStoreService.projectName()}}
        </button>
      }


    </div>
    <div class="flex items-center gap-4">
      <span class="text-xs text-gray-500">Copyright</span>
      <span class="text-xs text-gray-500">Help</span>
      <span class="text-xs text-gray-500">Contact</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-1 overflow-hidden">
    <app-file-management class="flex-shrink-0 basis-[15%]"></app-file-management>
    <app-editor-panel
      class="flex-1 flex flex-col min-w-0 h-full"
      (compileRequest)="handleCompile($event)"
      (executeRequest)="handleExecute($event)"
    />
    <app-console class="max-w-[30%] w-full" [msgs]="consoleMsgs()"></app-console>
  </div>
</div>
