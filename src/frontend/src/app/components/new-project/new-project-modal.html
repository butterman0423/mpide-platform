<div class="modal-overlay"
  role="button"
  tabindex="0"
  (mousedown)="onCancel()"
  (keydown.enter)="onCancel()"
  (window:keydown.escape)="onCancel()">
  
  <div class="modal"
    (mousedown)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title">
    
    <div class="modal-header">
      <h2 id="modal-title">New Project</h2>
      <button class="close-btn" (click)="onCancel()">✕</button>
    </div>
    
    <div class="modal-body">
      <label for="new-project-name" class="modal-label">Project Name</label>
      <input
        id="new-project-name"
        [(ngModel)]="projectName"
        type="text"
        class="modal-input"
        [class.input-error]="isNameTaken()"
        placeholder="Untitled Project"
        (keydown.enter)="onConfirm()"
      />
      @if (isNameTaken()) {
        <span class="error-msg">A project with this name already exists.</span>
      }
    </div>
    
    <div class="modal-footer">
      <div class="footer-right">
        <button class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button class="btn-connect" [disabled]="isConfirmDisabled()" (click)="onConfirm()">Confirm</button>
      </div>
    </div>
  </div>
</div>
