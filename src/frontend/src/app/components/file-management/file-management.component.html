<div class="flex flex-col gap-0 h-full">
  <div class="w-full bg-[#1E293B] text-white font-bold h-[4vh] p-3 flex justify-between items-center">
    <p>Files</p>
    <button (click)="handleClick()" class="flex flex-stretch p-2 cursor-pointer hover:bg-[#475569]">
      <nz-icon nzType="file-add" nzTheme="outline" />
    </button>
  </div>
  <nz-divider/>
  <div class="w-full bg-[#334155] text-white flex-1 flex flex-col gap-0 justify-start">
      @for (file of this.fileStoreList.fileList(); track file.fileLink) {
        <!--So the function doesn't run everytime-->
        <app-file-card [file]="file"
          [editFileKey]="editFile()"
          (editFile)="handleEditFile($event)"
          (cancelEdit)="resetEditFile()"
          (fileSelected)="onFileSelected($event)"
          (deleteFile)="deleteFile($event)"/>
      }
      @if (addFile) { 
        <div class="ml-9 mr-4 bg-[#1E293B]">
            <form 
            class="flex flex-row justify-center gap-0"
            [formGroup]="fileForm" 
            (ngSubmit)="handleAddFile()"
            >
              <input #fileInput formControlName="newFile" 
              class="w-full border-1 focus:outline-none"
              [class.border-red-500]="fileError"
              [class.border-[#1890FF]]="!fileError"
              >

              <button type="submit" class="card-buttons bg-[#1890FF] hover:bg-[#60A5FA]">
                <nz-icon nzType="check" nzTheme="outline" />
              </button>

              <button type="button" (click)="resetAddFile()" class="card-buttons bg-[#7F1D1D] hover:bg-[#991B1B]">
                <nz-icon nzType="close" nzTheme="outline" />
              </button>

            </form>

          @if (fileError) {
            <p class="text-red-500 mr-16">
              {{errorMessage}}
            </p>
          }
        </div>
      }
  </div>
  
</div>
