@if (isBrowser) {
    <div class="w-full bg-[#1E293B] h-[4vh] flex items-center justify-between">
      <!-- Left side: file tab -->
      <div class="flex h-full">
        @if (fileSelectionService.selectedFile()){
          <div class="h-[4vh] w-fit bg-[#334155] text-white px-3 flex items-center justify-center gap-2">
            <nz-icon nzType="diff" nzTheme="outline" />
            <p class="text-sm">{{ fileSelectionService.selectedFile()?.fileName }}</p>
            <nz-icon nzType="close" nzTheme="outline" (click)="handleDelete()" class="hover:bg-[#54667a]"/>
          </div>
        }
      </div>

      <!-- Right side: action buttons -->
      <div class="flex items-center gap-2 px-3">
         <button
         type="button"
         class="text-xs px-3 py-1 text-white rounded hover:cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
         [ngClass]="isCompiling() ? 'bg-red-600 hover:bg-red-500' : 'bg-[#3B82F6] hover:bg-[#2563eb]'"
         style="font-family: 'Roboto', sans-serif; font-weight: 800;"
         [disabled]="compileActionsLocked() && !isCompiling()"
         (click)="handleCompileOrStop()">{{ isCompiling() ? 'Stop' : 'Compile' }}</button>
         <button
         type="button"
         class="text-xs px-3 py-1 bg-[#3B82F6] text-white rounded hover:bg-[#2563eb] hover:cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
         style="font-family: 'Roboto', sans-serif; font-weight: 800;"
         [disabled]="compileActionsLocked() || isCompiling()"
         (click)="handleExecuteRequest()">Execute</button>
        <app-board-selector />
      </div>
    </div>

  <ngx-monaco-editor class="flex-1 flex flex-col min-w-0 h-full"
    [options]="editorOptions" 
    [(ngModel)]="code"
    (ngModelChange)="onCodeChange($event)">
  </ngx-monaco-editor>
}
